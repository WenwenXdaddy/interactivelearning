name: Verify live learning site

# Manual only. Cloudflare bot protection answers 403 to GitHub runner IPs, so an automatic run on push
# would always fail without telling us anything about the deployment. Verify production locally instead:
# `npm run verify:live` (see DEPLOYMENT.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-live-learning-site
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out reference files without retaining credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production identity, course hashes, headers, downloads and 404
        shell: bash
        run: |
          mkdir -p live-evidence
          set +e
          npm run verify:live > live-evidence/http-verification.txt 2>&1
          code=$?
          set -e
          cat live-evidence/http-verification.txt
          # Exit code 2 means this runner was blocked at the edge: the check never reached the site, so the
          # result says nothing about the deployment. Fail loudly rather than pretend it passed.
          if [ "$code" = "2" ]; then
            echo "::warning::Inconclusive from GitHub runners (edge protection). Run 'npm run verify:live' from a normal network."
          fi
          exit "$code"
      - name: Install isolated browser test tools
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/learning-browser"
          "$RUNNER_TEMP/learning-browser/bin/pip" install --disable-pip-version-check playwright==1.55.0
          "$RUNNER_TEMP/learning-browser/bin/python" -m playwright install --with-deps chromium
      - name: Exercise the real HTTPS site with native browser storage
        shell: bash
        run: |
          "$RUNNER_TEMP/learning-browser/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          BASE = 'https://learning.jiadi.ai'
          evidence = Path('live-evidence')
          results = []
          def check(name, condition):
              results.append({'test': name, 'passed': bool(condition)})
              print(('PASS ' if condition else 'FAIL ') + name, flush=True)
              if not condition:
                  raise AssertionError(name)

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  context = browser.new_context(viewport={'width': 1440, 'height': 1000}, accept_downloads=True)
                  page = context.new_page()
                  page.set_default_timeout(15000)
                  errors = []
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  response = page.goto(BASE + '/', wait_until='networkidle', timeout=45000)
                  check('HTTPS homepage returns 200', response.status == 200)
                  check('Homepage identifies the learning site', 'JIADI' in page.title())
                  check('Homepage links to both courses', all(page.locator('a[href*="courses/' + slug + '"]').count() > 0 for slug in ['gold-volatility', 'unknown-unknowable']))
                  page.screenshot(path=str(evidence / 'desktop-home.png'))

                  # Per-course controls. gold-volatility keeps its original lab markup; unknown-unknowable was
                  # rebuilt on the interactive-learning-lab template on 2026-09-19 (15 stations, template ids).
                  for slug, count, nav, glossary_btn, search_selector, query, theme_btn, export_btn, active_lesson, slider_nav_index in [
                      ('gold-volatility', 10, '#nav button', '#glossaryBtn', '#glossarySearch', 'Delta', '#themeBtn', '#exportBtn', 'section.lesson.active', 2),
                      ('unknown-unknowable', 15, '[data-lesson-button]', '#dictionary-button', '#term-search', 'UU', '#theme-toggle', '#export-button', 'section.lesson:not([hidden])', 3),
                  ]:
                      response = page.goto(BASE + '/courses/' + slug + '/', wait_until='networkidle', timeout=45000)
                      check(slug + ': HTTPS course returns 200', response.status == 200)
                      page.locator(nav).first.wait_for(state='visible')
                      check(slug + ': all chapter navigation buttons render', page.locator(nav).count() == count)
                      check(slug + ': SVG graphics render', page.locator('svg path[d], svg polyline, svg line, svg rect').count() > 0)
                      page.locator(glossary_btn).click()
                      page.locator('dialog[open]').wait_for(state='visible')
                      page.locator(search_selector).fill(query)
                      check(slug + ': glossary search is interactive', page.locator(search_selector).input_value() == query and len(page.locator('dialog[open]').inner_text()) > 30)
                      # A non-empty type="search" box swallows the first Escape (the browser clears the field
                      # instead of closing the dialog), so clear it first and allow a bounded retry.
                      page.locator(search_selector).fill('')
                      for _ in range(2):
                          page.keyboard.press('Escape')
                          if page.locator('dialog[open]').count() == 0:
                              break
                          page.wait_for_timeout(200)
                      check(slug + ': Escape closes the glossary', page.locator('dialog[open]').count() == 0)

                      page.locator(nav).nth(slider_nav_index).click()
                      slider = page.locator(active_lesson + ' input[type="range"]').first
                      slider.wait_for(state='visible')
                      before_value = slider.input_value()
                      before_text = page.locator(active_lesson).inner_text()
                      slider.focus()
                      slider.press('ArrowRight')
                      check(slug + ': keyboard changes a parameter', slider.input_value() != before_value)
                      check(slug + ': parameter updates the displayed lesson', page.locator(active_lesson).inner_text() != before_text)

                      page.locator(theme_btn).click()
                      theme = page.locator('body').get_attribute('class') or ''
                      check(slug + ': native localStorage has saved state', page.evaluate('Object.keys(localStorage).length') > 0)
                      page.reload(wait_until='networkidle')
                      page.locator(nav).first.wait_for(state='visible')
                      check(slug + ': theme survives a real HTTPS reload', (page.locator('body').get_attribute('class') or '') == theme)

                      with page.expect_download() as downloaded:
                          page.locator(export_btn).click()
                      output = evidence / (slug + '-test-export.md')
                      downloaded.value.save_as(str(output))
                      check(slug + ': Markdown export downloads nonempty notes', output.stat().st_size > 100)
                      check(slug + ': home navigation is retained', page.locator('a[href="../../index.html#courses"]').count() > 0)
                      page.locator(nav).first.click()
                      page.screenshot(path=str(evidence / (slug + '-desktop.png')))

                  check('No uncaught JavaScript exceptions in desktop interactions', not errors)
                  mobile = browser.new_context(viewport={'width': 390, 'height': 844}, is_mobile=True, has_touch=True, device_scale_factor=1)
                  mp = mobile.new_page()
                  for route, label, glossary_btn in [('/', 'home', None), ('/courses/gold-volatility/', 'gold', '#glossaryBtn'), ('/courses/unknown-unknowable/', 'unknown', '#dictionary-button')]:
                      response = mp.goto(BASE + route, wait_until='networkidle', timeout=45000)
                      check(label + ': mobile viewport loads over HTTPS', response.status == 200)
                      # Measure against the layout viewport: with mobile emulation Chromium zooms out to fit
                      # wide content, so innerWidth grows with the overflow and would hide it.
                      check(label + ': no page-level horizontal overflow at 390px', mp.evaluate('document.documentElement.scrollWidth <= document.documentElement.clientWidth + 2'))
                      mp.screenshot(path=str(evidence / (label + '-mobile.png')))
                      if glossary_btn:
                          mp.locator(glossary_btn).click()
                          mp.locator('dialog[open]').wait_for(state='visible')
                          check(label + ': touch viewport glossary opens', mp.locator('dialog[open]').is_visible())
                          mp.screenshot(path=str(evidence / (label + '-mobile-glossary.png')))
                          mp.keyboard.press('Escape')
                  browser.close()
          finally:
              payload = {'base': BASE, 'reference_commit': os.environ.get('GITHUB_SHA'), 'storage': 'native browser localStorage on real HTTPS; no mock or shim', 'coverage': 'Chromium desktop and 390px touch viewport, not a real iPhone or Safari', 'results': results}
              (evidence / 'browser-results.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write('### Read-only live site verification\n\n')
                  summary.write(str(sum(x['passed'] for x in results)) + '/' + str(len(results)) + ' browser checks passed. See the HTTP verification step and the evidence artifact.\n\n')
                  summary.write('This job does not deploy or modify DNS. Uses a fresh browser profile and synthetic learning activity only. True iPhone/Safari is not tested.\n')
          PY
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-live-verification
          path: live-evidence/
          retention-days: 7
          if-no-files-found: warn
