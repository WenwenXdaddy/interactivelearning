name: Validate learning site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development tools without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check script syntax
        run: |
          for file in scripts/*.mjs; do
            node --check "$file"
          done
      - name: Build and validate course integrity
        run: npm test
      - name: Require committed static output to match its source
        run: git diff --exit-code -- public/
