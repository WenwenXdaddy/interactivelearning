name: Import verified learning site

on:
  push:
    branches: [main]
    paths: ['learning-lab-site-v1.0.0.zip']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-learning-site
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact upload commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore only the fingerprint-verified original archive
        run: python3 .github/scripts/import-site.py
      - name: Record dependency resolution without running package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Build and validate the two unchanged course scripts
        run: npm test
      - name: Commit the complete source and generated website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import two verified learning courses for learning.jiadi.ai'
            git push origin HEAD:main
          fi
      - name: State publication boundary
        run: |
          echo 'The site source was imported into GitHub. Cloudflare deployment was not performed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Next: connect this repository to the learning-lab Worker and verify learning.jiadi.ai.' >> "$GITHUB_STEP_SUMMARY"
